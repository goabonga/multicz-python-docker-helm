name: integration

# Runs after `ci` finishes green on main. Validates the upcoming
# release end-to-end without publishing anything:
#
#   1. plan the release (skip if nothing pending)
#   2. apply the bump to the working tree (no commit, no tag, no push)
#   3. build api + web docker images at the future tags
#   4. spin up a kind cluster with extraPortMappings 80/443 + ingress-
#      ready node label, install the kubernetes/ingress-nginx
#      controller manifest, wait for it to be Ready
#   5. package the subcharts into the umbrella's charts/ directory
#      and `helm install --wait` with ingress.enabled=true on both
#      subcharts (matches the production helm install path that the
#      release pipeline uses, minus pushing the artifacts)
#   6. curl the future versions through the ingress
#      (Host: api.myapp.local /version, Host: myapp.local /version.json)
#      and fail if either doesn't match the planned version
#
# Static helm checks (lint + smoke render) live in `ci.yml`'s
# chart-{api,web,}-check jobs and gate this pipeline upstream.
#
# The `release` workflow is gated on this one passing — a regression
# in this pipeline is a hard stop before any image, chart, or tag
# reaches the remote.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install multicz
        run: uv tool install multicz

      - name: Plan
        id: plan
        run: |
          multicz plan --summary "$GITHUB_STEP_SUMMARY" \
            --output json | tee /tmp/plan.json
          if [ "$(jq '.bumps | length' /tmp/plan.json)" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending — nothing to integration-test"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump to working tree (writes only, no commit)
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          multicz bump --output json | tee /tmp/bump.json
          API=$(jq -r       '.bumps.api.next_version          // empty' /tmp/bump.json)
          WEB=$(jq -r       '.bumps.web.next_version          // empty' /tmp/bump.json)
          CHART_API=$(jq -r '.bumps["chart-api"].next_version // empty' /tmp/bump.json)
          CHART_WEB=$(jq -r '.bumps["chart-web"].next_version // empty' /tmp/bump.json)
          CHART=$(jq -r     '.bumps.chart.next_version        // empty' /tmp/bump.json)
          echo "api_version=$API"             >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB"             >> "$GITHUB_OUTPUT"
          echo "chart_api_version=$CHART_API" >> "$GITHUB_OUTPUT"
          echo "chart_web_version=$CHART_WEB" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART"         >> "$GITHUB_OUTPUT"
          {
            echo "## integration"
            echo
            echo "### Planned versions"
            echo
            echo "| component | next |"
            echo "|---|---|"
            [ -n "$API"       ] && echo "| api       | \`$API\` |"
            [ -n "$WEB"       ] && echo "| web       | \`$WEB\` |"
            [ -n "$CHART_API" ] && echo "| chart-api | \`$CHART_API\` |"
            [ -n "$CHART_WEB" ] && echo "| chart-web | \`$CHART_WEB\` |"
            [ -n "$CHART"     ] && echo "| chart     | \`$CHART\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute lowercase owner
        if: steps.plan.outputs.release == 'true'
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.bump.outputs.api_version != '' || steps.bump.outputs.web_version != ''

      - name: Build api image (load locally for kind)
        id: build_api
        if: steps.bump.outputs.api_version != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/myapp:${{ steps.bump.outputs.api_version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image (load locally for kind)
        id: build_web
        if: steps.bump.outputs.web_version != ''
        uses: docker/build-push-action@v7
        with:
          context: web
          load: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/web:${{ steps.bump.outputs.web_version }}
          # Bake the cross-origin api URL into the SPA bundle so
          # `fetch(`${API_URL}/version`)` hits the api ingress (kind
          # extraPortMapping 80 + /etc/hosts pin → ingress-nginx →
          # api Service). The api allows the cross-origin via its
          # CORS middleware (default origins=*).
          build-args: |
            VITE_API_URL=http://api.myapp.local
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build summary
        if: steps.bump.outputs.api_version != '' || steps.bump.outputs.web_version != ''
        run: |
          {
            echo
            echo "### Built images (load: true, no push)"
            echo
            echo "| image | tag | digest |"
            echo "|---|---|---|"
            if [ -n "${{ steps.bump.outputs.api_version }}" ]; then
              echo "| ghcr.io/${{ steps.owner.outputs.value }}/myapp | \`${{ steps.bump.outputs.api_version }}\` | \`${{ steps.build_api.outputs.digest }}\` |"
            fi
            if [ -n "${{ steps.bump.outputs.web_version }}" ]; then
              echo "| ghcr.io/${{ steps.owner.outputs.value }}/web | \`${{ steps.bump.outputs.web_version }}\` | \`${{ steps.build_web.outputs.digest }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/setup-helm@v5
        if: steps.plan.outputs.release == 'true'

      - name: Bundle subcharts for the smoke install
        # Helm install reads charts/myapp/charts/*.tgz for file-based
        # dep resolution. Lint already happened in `ci.yml`'s
        # chart-{api,web,}-check jobs.
        if: steps.bump.outputs.chart_version != ''
        run: |
          mkdir -p charts/myapp/charts
          helm package charts/myapp-api -d charts/myapp/charts
          helm package charts/myapp-web -d charts/myapp/charts
          {
            echo
            echo "### Subchart bundle"
            echo
            echo '```'
            ls -la charts/myapp/charts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write kind config (ingress port mappings)
        if: steps.plan.outputs.release == 'true'
        # Two changes from kind defaults:
        #  - extraPortMappings 80/443 host -> control-plane container
        #    so curls hitting localhost reach the ingress controller
        #  - node-label `ingress-ready=true` so the official
        #    kubernetes/ingress-nginx kind manifest's nodeSelector
        #    can pin the controller to this node
        run: |
          mkdir -p /tmp/kind
          cat > /tmp/kind/config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
                - containerPort: 443
                  hostPort: 443
                  protocol: TCP
          EOF

      - name: Set up kind cluster
        if: steps.plan.outputs.release == 'true'
        uses: helm/kind-action@v1
        with:
          cluster_name: smoke
          config: /tmp/kind/config.yaml

      - name: Cluster summary
        if: steps.plan.outputs.release == 'true'
        run: |
          kubectl cluster-info > /tmp/cluster.txt
          kubectl get nodes -o wide > /tmp/nodes.txt
          {
            echo
            echo "### Kind cluster"
            echo
            echo '```'
            cat /tmp/cluster.txt
            echo
            cat /tmp/nodes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install ingress-nginx controller
        if: steps.plan.outputs.release == 'true'
        run: |
          kubectl apply -f \
            https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx \
            rollout status deployment/ingress-nginx-controller --timeout=180s
          {
            echo
            echo "### Ingress controller"
            echo
            echo '```'
            kubectl -n ingress-nginx get pods,svc
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Load smoke images into kind
        if: steps.bump.outputs.api_version != '' || steps.bump.outputs.web_version != ''
        run: |
          if [ -n "${{ steps.bump.outputs.api_version }}" ]; then
            kind load docker-image \
              "ghcr.io/${{ steps.owner.outputs.value }}/myapp:${{ steps.bump.outputs.api_version }}" \
              --name smoke
          fi
          if [ -n "${{ steps.bump.outputs.web_version }}" ]; then
            kind load docker-image \
              "ghcr.io/${{ steps.owner.outputs.value }}/web:${{ steps.bump.outputs.web_version }}" \
              --name smoke
          fi
          {
            echo
            echo "### Loaded images"
            echo
            echo '```'
            kubectl get nodes -o jsonpath='{range .items[*]}{.status.images[*].names[*]}{"\n"}{end}' \
              | tr ' ' '\n' \
              | grep -E 'goabonga/(myapp|web):' \
              | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Helm install umbrella in kind (with ingress)
        if: steps.bump.outputs.chart_version != ''
        run: |
          # --namespace myapp matches the hardened chart defaults
          # (CKV_K8S_21). pullPolicy=IfNotPresent forces use of the
          # kind-loaded image. ingress.enabled=true on both subcharts
          # turns the api on at api.myapp.local and the web at
          # myapp.local; ingressClassName=nginx routes them through
          # the ingress-nginx controller installed above.
          helm install demo charts/myapp \
            --wait --timeout 120s \
            --namespace myapp --create-namespace \
            --set "myapp-api.image.repository=ghcr.io/${{ steps.owner.outputs.value }}/myapp" \
            --set "myapp-api.image.pullPolicy=IfNotPresent" \
            --set "myapp-api.ingress.enabled=true" \
            --set "myapp-api.ingress.className=nginx" \
            --set "myapp-web.image.repository=ghcr.io/${{ steps.owner.outputs.value }}/web" \
            --set "myapp-web.image.pullPolicy=IfNotPresent" \
            --set "myapp-web.ingress.enabled=true" \
            --set "myapp-web.ingress.className=nginx"
          {
            echo
            echo "### Helm release"
            echo
            echo '```'
            helm list -n myapp
            echo
            kubectl -n myapp get all,ingress
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for ingress to route
        if: steps.bump.outputs.chart_version != ''
        # ingress objects can take a moment to wire up — retry until
        # at least one of the routes returns 2xx (the smoke step
        # below validates the body content separately).
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null -H "Host: myapp.local" http://localhost/version.json && \
            curl -fsS -o /dev/null -H "Host: api.myapp.local" http://localhost/health && \
            break
            sleep 2
          done

      - name: Smoke test through nginx ingress
        if: steps.bump.outputs.chart_version != ''
        env:
          API_EXPECTED: ${{ steps.bump.outputs.api_version }}
          WEB_EXPECTED: ${{ steps.bump.outputs.web_version }}
        run: |
          set -e
          {
            echo
            echo "### Smoke test (via nginx ingress)"
            echo
            echo "| host + path | expected | got | status |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0

          if [ -n "$API_EXPECTED" ]; then
            GOT=$(curl -fsS -H "Host: api.myapp.local" \
              http://localhost/version | jq -r .version)
            if [ "$GOT" = "$API_EXPECTED" ]; then
              echo "| \`api.myapp.local/version\` | \`$API_EXPECTED\` | \`$GOT\` | ✓ |" \
                >> "$GITHUB_STEP_SUMMARY"
              echo "✓ api /version = $GOT"
            else
              echo "| \`api.myapp.local/version\` | \`$API_EXPECTED\` | \`$GOT\` | ✗ |" \
                >> "$GITHUB_STEP_SUMMARY"
              echo "::error::api /version returned '$GOT', expected '$API_EXPECTED'"
              kubectl -n myapp logs -l app.kubernetes.io/component=api --tail=50 || true
              FAIL=1
            fi
          fi

          if [ -n "$WEB_EXPECTED" ]; then
            GOT=$(curl -fsS -H "Host: myapp.local" \
              http://localhost/version.json | jq -r .version)
            if [ "$GOT" = "$WEB_EXPECTED" ]; then
              echo "| \`myapp.local/version.json\` | \`$WEB_EXPECTED\` | \`$GOT\` | ✓ |" \
                >> "$GITHUB_STEP_SUMMARY"
              echo "✓ web /version.json = $GOT"
            else
              echo "| \`myapp.local/version.json\` | \`$WEB_EXPECTED\` | \`$GOT\` | ✗ |" \
                >> "$GITHUB_STEP_SUMMARY"
              echo "::error::web /version.json returned '$GOT', expected '$WEB_EXPECTED'"
              kubectl -n myapp logs -l app.kubernetes.io/component=web --tail=50 || true
              FAIL=1
            fi
          fi

          [ "$FAIL" = "0" ]

      # ---------- E2E (Cucumber + Playwright via the kind ingress) ----------

      - uses: actions/setup-node@v6
        if: steps.bump.outputs.chart_version != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web devDeps + playwright chromium
        if: steps.bump.outputs.chart_version != ''
        working-directory: web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Map ingress hostnames to localhost
        if: steps.bump.outputs.chart_version != ''
        # Playwright's chromium honours the Host header set by the URL
        # itself (it doesn't expose easy per-request Host overrides),
        # so we point myapp.local + api.myapp.local at 127.0.0.1 via
        # /etc/hosts. kind's extraPortMappings forward 80 to the
        # ingress controller, completing the chain.
        run: |
          echo "127.0.0.1 myapp.local api.myapp.local" | sudo tee -a /etc/hosts

      - name: E2E (Cucumber + Playwright)
        if: steps.bump.outputs.chart_version != ''
        working-directory: web
        env:
          BASE_URL: http://myapp.local
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          npm run test:e2e 2>&1 | tee /tmp/e2e.out
          RC=${PIPESTATUS[0]}
          {
            echo
            echo "### E2E (cucumber + playwright via ingress)"
            echo
            echo "**target**: \`\$BASE_URL=$BASE_URL\` — exit $RC"
            echo
            echo '```'
            tail -n 50 /tmp/e2e.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
