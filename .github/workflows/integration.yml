name: integration

# Runs after `ci` finishes green on main. Validates the upcoming
# release end-to-end without publishing anything.
#
# Three jobs:
#
#   prepare      multicz plan -> bump (no commit), build api + web
#                docker images, package the umbrella subcharts.
#                Uploads three artifacts: api-image.tar,
#                web-image.tar, subchart-bundle.
#
#   e2e-api      kind cluster + ingress-nginx, kind-load the api
#                image, helm install (api ingress at api.myapp.local),
#                run behave + requests against the ingress URL.
#                Native python BDD against the running api.
#
#   e2e-web      same kind+ingress setup, kind-load BOTH images
#                (the SPA lives at myapp.local but cross-origin
#                fetches api.myapp.local at runtime), helm install
#                with myapp-web.config.apiUrl pointed at the api
#                ingress, run cucumber + playwright headless.
#
# e2e-api and e2e-web run in parallel — each on its OWN kind cluster
# (different runner VMs; kind clusters can't be shared across jobs).
# `release` is gated on this whole workflow; if either e2e job fails,
# release doesn't fire.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)') }}
    outputs:
      release:           ${{ steps.plan.outputs.release }}
      api_version:       ${{ steps.bump.outputs.api_version }}
      web_version:       ${{ steps.bump.outputs.web_version }}
      chart_api_version: ${{ steps.bump.outputs.chart_api_version }}
      chart_web_version: ${{ steps.bump.outputs.chart_web_version }}
      chart_version:     ${{ steps.bump.outputs.chart_version }}
      owner:             ${{ steps.owner.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install multicz
        run: uv tool install multicz

      - name: Plan
        id: plan
        run: |
          multicz plan --summary "$GITHUB_STEP_SUMMARY" \
            --output json | tee /tmp/plan.json
          if [ "$(jq '.bumps | length' /tmp/plan.json)" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending — nothing to integration-test"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump to working tree (writes only, no commit)
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          multicz bump --output json | tee /tmp/bump.json
          API=$(jq -r       '.bumps.api.next_version          // empty' /tmp/bump.json)
          WEB=$(jq -r       '.bumps.web.next_version          // empty' /tmp/bump.json)
          CHART_API=$(jq -r '.bumps["chart-api"].next_version // empty' /tmp/bump.json)
          CHART_WEB=$(jq -r '.bumps["chart-web"].next_version // empty' /tmp/bump.json)
          CHART=$(jq -r     '.bumps.chart.next_version        // empty' /tmp/bump.json)
          echo "api_version=$API"             >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB"             >> "$GITHUB_OUTPUT"
          echo "chart_api_version=$CHART_API" >> "$GITHUB_OUTPUT"
          echo "chart_web_version=$CHART_WEB" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART"         >> "$GITHUB_OUTPUT"
          {
            echo "## prepare"
            echo
            echo "### Planned versions"
            echo
            echo "| component | next |"
            echo "|---|---|"
            [ -n "$API"       ] && echo "| api       | \`$API\` |"
            [ -n "$WEB"       ] && echo "| web       | \`$WEB\` |"
            [ -n "$CHART_API" ] && echo "| chart-api | \`$CHART_API\` |"
            [ -n "$CHART_WEB" ] && echo "| chart-web | \`$CHART_WEB\` |"
            [ -n "$CHART"     ] && echo "| chart     | \`$CHART\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve current versions from working tree
        # After `multicz bump --output json`, pyproject.toml +
        # web/package.json reflect the bumped versions for the
        # components that bumped, and stay at the previous version
        # for those that didn't. We always need both images to
        # deploy a working stack downstream — read the file values
        # so the build tags are correct regardless of which
        # component the diff touched.
        if: steps.plan.outputs.release == 'true'
        id: versions
        run: |
          API_VER=$(awk -F'"' '/^version =/{print $2; exit}' pyproject.toml)
          WEB_VER=$(jq -r .version web/package.json)
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "api=$API_VER"   >> "$GITHUB_OUTPUT"
          echo "web=$WEB_VER"   >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER"   >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.plan.outputs.release == 'true'

      # ALWAYS build both images. A chart-only bump still needs both
      # api + web running to validate the deploy end-to-end.
      - name: Build api image
        id: build_api
        if: steps.plan.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/${{ steps.versions.outputs.owner }}/myapp:${{ steps.versions.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        id: build_web
        if: steps.plan.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: web
          load: true
          tags: ghcr.io/${{ steps.versions.outputs.owner }}/web:${{ steps.versions.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Save image tarballs
        if: steps.plan.outputs.release == 'true'
        run: |
          mkdir -p /tmp/images
          docker save \
            "ghcr.io/${{ steps.versions.outputs.owner }}/myapp:${{ steps.versions.outputs.api }}" \
            -o /tmp/images/api.tar
          docker save \
            "ghcr.io/${{ steps.versions.outputs.owner }}/web:${{ steps.versions.outputs.web }}" \
            -o /tmp/images/web.tar

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.release == 'true'
        with:
          name: api-image
          path: /tmp/images/api.tar
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.release == 'true'
        with:
          name: web-image
          path: /tmp/images/web.tar
          retention-days: 1

      - uses: azure/setup-helm@v5
        if: steps.plan.outputs.release == 'true'

      - name: Bundle subcharts for the smoke install
        if: steps.plan.outputs.release == 'true'
        run: |
          mkdir -p charts/myapp/charts /tmp/subcharts
          helm package charts/myapp-api -d charts/myapp/charts
          helm package charts/myapp-web -d charts/myapp/charts
          cp charts/myapp/charts/*.tgz /tmp/subcharts/

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.release == 'true'
        with:
          name: subchart-bundle
          path: /tmp/subcharts/
          retention-days: 1

      - name: Build summary
        if: steps.plan.outputs.release == 'true'
        run: |
          {
            echo
            echo "### Built images (load: true, no push)"
            echo
            echo "| image | tag | digest |"
            echo "|---|---|---|"
            if [ -n "${{ steps.bump.outputs.api_version }}" ]; then
              echo "| ghcr.io/${{ steps.owner.outputs.value }}/myapp | \`${{ steps.bump.outputs.api_version }}\` | \`${{ steps.build_api.outputs.digest }}\` |"
            fi
            if [ -n "${{ steps.bump.outputs.web_version }}" ]; then
              echo "| ghcr.io/${{ steps.owner.outputs.value }}/web | \`${{ steps.bump.outputs.web_version }}\` | \`${{ steps.build_web.outputs.digest }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-api:
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.chart_version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/download-artifact@v8
        with:
          name: api-image
          path: /tmp/images
      - uses: actions/download-artifact@v8
        with:
          name: web-image
          path: /tmp/images
      - uses: actions/download-artifact@v8
        with:
          name: subchart-bundle
          path: charts/myapp/charts

      - name: docker load + extract image names
        # docker save preserves tags; docker load echoes
        # `Loaded image: <name>:<tag>` per image — extract that
        # so downstream steps don't need needs.<X>.outputs.<version>.
        # Each image's repo (everything before the final `:`) is
        # then peeled off so helm install can override
        # myapp-{api,web}.image.repository while letting Chart.yaml
        # provide the tag via .Chart.AppVersion.
        id: images
        run: |
          API_IMAGE=$(docker load -i /tmp/images/api.tar | awk -F': ' '/Loaded image:/{print $2; exit}')
          WEB_IMAGE=$(docker load -i /tmp/images/web.tar | awk -F': ' '/Loaded image:/{print $2; exit}')
          echo "api=$API_IMAGE"          >> "$GITHUB_OUTPUT"
          echo "web=$WEB_IMAGE"          >> "$GITHUB_OUTPUT"
          echo "api_repo=${API_IMAGE%:*}" >> "$GITHUB_OUTPUT"
          echo "web_repo=${WEB_IMAGE%:*}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5

      - name: Write kind config (ingress port mappings)
        run: |
          mkdir -p /tmp/kind
          cat > /tmp/kind/config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
          EOF

      - uses: helm/kind-action@v1
        with:
          cluster_name: e2e-api
          config: /tmp/kind/config.yaml

      - name: Install ingress-nginx + load images
        run: |
          kubectl apply -f \
            https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx \
            rollout status deployment/ingress-nginx-controller --timeout=180s
          kind load docker-image "${{ steps.images.outputs.api }}" --name e2e-api
          kind load docker-image "${{ steps.images.outputs.web }}" --name e2e-api

      - name: Helm install
        run: |
          helm install demo charts/myapp \
            --wait --timeout 120s \
            --namespace myapp --create-namespace \
            --set "myapp-api.image.repository=${{ steps.images.outputs.api_repo }}" \
            --set "myapp-api.image.pullPolicy=IfNotPresent" \
            --set "myapp-api.ingress.enabled=true" \
            --set "myapp-api.ingress.className=nginx" \
            --set "myapp-web.image.repository=${{ steps.images.outputs.web_repo }}" \
            --set "myapp-web.image.pullPolicy=IfNotPresent"
          {
            echo "## e2e-api"
            echo
            echo "### Helm release"
            echo '```'
            kubectl -n myapp get all,ingress
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Map ingress hostname to localhost
        run: |
          echo "127.0.0.1 api.myapp.local" | sudo tee -a /etc/hosts

      - name: Wait for ingress to route
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://api.myapp.local/health && break
            sleep 2
          done

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install behave + requests
        run: uv tool install behave --with requests

      - name: behave (BDD against the api ingress)
        env:
          BASE_URL: http://api.myapp.local
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          behave e2e --no-color 2>&1 | tee /tmp/behave.out
          RC=${PIPESTATUS[0]}
          {
            echo
            echo "### behave"
            echo
            echo "**target**: \`\$BASE_URL=$BASE_URL\` — exit $RC"
            echo
            echo '```'
            tail -n 80 /tmp/behave.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  e2e-web:
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.chart_version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/download-artifact@v8
        with:
          name: api-image
          path: /tmp/images
      - uses: actions/download-artifact@v8
        with:
          name: web-image
          path: /tmp/images
      - uses: actions/download-artifact@v8
        with:
          name: subchart-bundle
          path: charts/myapp/charts

      - name: docker load + extract image names
        id: images
        run: |
          API_IMAGE=$(docker load -i /tmp/images/api.tar | awk -F': ' '/Loaded image:/{print $2; exit}')
          WEB_IMAGE=$(docker load -i /tmp/images/web.tar | awk -F': ' '/Loaded image:/{print $2; exit}')
          echo "api=$API_IMAGE"          >> "$GITHUB_OUTPUT"
          echo "web=$WEB_IMAGE"          >> "$GITHUB_OUTPUT"
          echo "api_repo=${API_IMAGE%:*}" >> "$GITHUB_OUTPUT"
          echo "web_repo=${WEB_IMAGE%:*}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5

      - name: Write kind config (ingress port mappings)
        run: |
          mkdir -p /tmp/kind
          cat > /tmp/kind/config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
          EOF

      - uses: helm/kind-action@v1
        with:
          cluster_name: e2e-web
          config: /tmp/kind/config.yaml

      - name: Install ingress-nginx + load images
        run: |
          kubectl apply -f \
            https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx \
            rollout status deployment/ingress-nginx-controller --timeout=180s
          kind load docker-image "${{ steps.images.outputs.api }}" --name e2e-web
          kind load docker-image "${{ steps.images.outputs.web }}" --name e2e-web

      - name: Helm install (web ingress + apiUrl pointed at api ingress)
        run: |
          helm install demo charts/myapp \
            --wait --timeout 120s \
            --namespace myapp --create-namespace \
            --set "myapp-api.image.repository=${{ steps.images.outputs.api_repo }}" \
            --set "myapp-api.image.pullPolicy=IfNotPresent" \
            --set "myapp-api.ingress.enabled=true" \
            --set "myapp-api.ingress.className=nginx" \
            --set "myapp-web.image.repository=${{ steps.images.outputs.web_repo }}" \
            --set "myapp-web.image.pullPolicy=IfNotPresent" \
            --set "myapp-web.ingress.enabled=true" \
            --set "myapp-web.ingress.className=nginx" \
            --set "myapp-web.config.apiUrl=http://api.myapp.local"
          {
            echo "## e2e-web"
            echo
            echo "### Helm release"
            echo '```'
            kubectl -n myapp get all,ingress
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Map ingress hostnames to localhost
        run: |
          echo "127.0.0.1 myapp.local api.myapp.local" | sudo tee -a /etc/hosts

      - name: Wait for ingress to route
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://myapp.local/version.json && \
            curl -fsS -o /dev/null http://api.myapp.local/health && break
            sleep 2
          done

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web devDeps + playwright chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: cucumber + playwright (against the kind ingress)
        working-directory: web
        env:
          BASE_URL: http://myapp.local
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          npm run test:e2e 2>&1 | tee /tmp/e2e.out
          RC=${PIPESTATUS[0]}
          {
            echo
            echo "### cucumber + playwright"
            echo
            echo "**target**: \`\$BASE_URL=$BASE_URL\` — exit $RC"
            echo
            echo '```'
            tail -n 80 /tmp/e2e.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  owasp-api:
    # OWASP ZAP DAST against the api's OpenAPI schema. Runs after
    # e2e-api passes — no point scanning a broken deploy. Spins its
    # own kind cluster (no cross-job kind reuse possible) and
    # replays the same helm install before turning ZAP loose on
    # http://api.myapp.local/openapi.json. Image repo + tag are
    # extracted from `docker load` output so we don't need any
    # `needs.prepare.outputs.*` plumbing — artifacts are
    # workflow-run-scoped and stay reachable through download-artifact.
    needs: [e2e-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/download-artifact@v8
        with:
          name: api-image
          path: /tmp/images
      - uses: actions/download-artifact@v8
        with:
          name: web-image
          path: /tmp/images
      - uses: actions/download-artifact@v8
        with:
          name: subchart-bundle
          path: charts/myapp/charts

      - name: docker load
        id: images
        run: |
          API_IMAGE=$(docker load -i /tmp/images/api.tar | awk -F': ' '/Loaded image:/{print $2; exit}')
          WEB_IMAGE=$(docker load -i /tmp/images/web.tar | awk -F': ' '/Loaded image:/{print $2; exit}')
          echo "api=$API_IMAGE"          >> "$GITHUB_OUTPUT"
          echo "web=$WEB_IMAGE"          >> "$GITHUB_OUTPUT"
          echo "api_repo=${API_IMAGE%:*}" >> "$GITHUB_OUTPUT"
          echo "web_repo=${WEB_IMAGE%:*}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5

      - name: Write kind config (ingress port mappings)
        run: |
          mkdir -p /tmp/kind
          cat > /tmp/kind/config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
          EOF

      - uses: helm/kind-action@v1
        with:
          cluster_name: zap-api
          config: /tmp/kind/config.yaml

      - name: Install ingress-nginx + load images
        run: |
          kubectl apply -f \
            https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx \
            rollout status deployment/ingress-nginx-controller --timeout=180s
          kind load docker-image "${{ steps.images.outputs.api }}" --name zap-api
          kind load docker-image "${{ steps.images.outputs.web }}" --name zap-api

      - name: Helm install
        run: |
          helm install demo charts/myapp \
            --wait --timeout 120s \
            --namespace myapp --create-namespace \
            --set "myapp-api.image.repository=${{ steps.images.outputs.api_repo }}" \
            --set "myapp-api.image.pullPolicy=IfNotPresent" \
            --set "myapp-api.ingress.enabled=true" \
            --set "myapp-api.ingress.className=nginx" \
            --set "myapp-web.image.repository=${{ steps.images.outputs.web_repo }}" \
            --set "myapp-web.image.pullPolicy=IfNotPresent"

      - name: Map ingress hostname to localhost
        run: |
          echo "127.0.0.1 api.myapp.local" | sudo tee -a /etc/hosts

      - name: Wait for ingress to route
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://api.myapp.local/openapi.json && break
            sleep 2
          done

      - name: OWASP ZAP api-scan (OpenAPI driven)
        # zap-api-scan.py crawls the schema, fuzzes each declared
        # endpoint, then runs the standard passive rules. Exit
        # codes: 0 clean, 1 fail (configurable), 2 warnings.
        # `-I` keeps WARN-level findings informational so a clean
        # api passes without us pre-tuning the rule set.
        # `--add-host` injects api.myapp.local into the ZAP
        # container's /etc/hosts (--network host alone doesn't
        # share the runner's hosts file).
        # `-c rules.tsv` loads .zap-rules.tsv (mounted into the
        # ZAP wrk dir) — silences false positives like the
        # cloud-metadata probe content-type mismatch.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          mkdir -p /tmp/zap && chmod 777 /tmp/zap
          cp .zap-rules.tsv /tmp/zap/rules.tsv
          docker run --rm \
            --network host \
            --add-host=api.myapp.local:127.0.0.1 \
            -v /tmp/zap:/zap/wrk:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://api.myapp.local/openapi.json \
              -f openapi \
              -c rules.tsv \
              -I \
              -r api-zap-report.html 2>&1 | tee /tmp/zap.out
          RC=${PIPESTATUS[0]}
          {
            echo "## owasp-api"
            echo
            echo "**zap-api-scan** \`http://api.myapp.local/openapi.json\` — exit $RC"
            echo
            echo '```'
            tail -n 80 /tmp/zap.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-api-report
          path: /tmp/zap/api-zap-report.html
          retention-days: 30

  owasp-web:
    # OWASP ZAP baseline scan (passive rules only) against the SPA
    # entry point — same kind/helm replay pattern as owasp-api.
    needs: [e2e-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/download-artifact@v8
        with:
          name: api-image
          path: /tmp/images
      - uses: actions/download-artifact@v8
        with:
          name: web-image
          path: /tmp/images
      - uses: actions/download-artifact@v8
        with:
          name: subchart-bundle
          path: charts/myapp/charts

      - name: docker load + extract image names
        id: images
        run: |
          API_IMAGE=$(docker load -i /tmp/images/api.tar | awk -F': ' '/Loaded image:/{print $2; exit}')
          WEB_IMAGE=$(docker load -i /tmp/images/web.tar | awk -F': ' '/Loaded image:/{print $2; exit}')
          echo "api=$API_IMAGE"          >> "$GITHUB_OUTPUT"
          echo "web=$WEB_IMAGE"          >> "$GITHUB_OUTPUT"
          echo "api_repo=${API_IMAGE%:*}" >> "$GITHUB_OUTPUT"
          echo "web_repo=${WEB_IMAGE%:*}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5

      - name: Write kind config (ingress port mappings)
        run: |
          mkdir -p /tmp/kind
          cat > /tmp/kind/config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
          EOF

      - uses: helm/kind-action@v1
        with:
          cluster_name: zap-web
          config: /tmp/kind/config.yaml

      - name: Install ingress-nginx + load images
        run: |
          kubectl apply -f \
            https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx \
            rollout status deployment/ingress-nginx-controller --timeout=180s
          kind load docker-image "${{ steps.images.outputs.api }}" --name zap-web
          kind load docker-image "${{ steps.images.outputs.web }}" --name zap-web

      - name: Helm install (web ingress + apiUrl)
        run: |
          helm install demo charts/myapp \
            --wait --timeout 120s \
            --namespace myapp --create-namespace \
            --set "myapp-api.image.repository=${{ steps.images.outputs.api_repo }}" \
            --set "myapp-api.image.pullPolicy=IfNotPresent" \
            --set "myapp-api.ingress.enabled=true" \
            --set "myapp-api.ingress.className=nginx" \
            --set "myapp-web.image.repository=${{ steps.images.outputs.web_repo }}" \
            --set "myapp-web.image.pullPolicy=IfNotPresent" \
            --set "myapp-web.ingress.enabled=true" \
            --set "myapp-web.ingress.className=nginx" \
            --set "myapp-web.config.apiUrl=http://api.myapp.local"

      - name: Map ingress hostnames to localhost
        run: |
          echo "127.0.0.1 myapp.local api.myapp.local" | sudo tee -a /etc/hosts

      - name: Wait for ingress to route
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://myapp.local/version.json && break
            sleep 2
          done

      - name: OWASP ZAP baseline (passive rules over the SPA)
        # zap-baseline.py is the spider + passive rule set — fast,
        # safe, no fuzzing of forms. Same -I (informational) flag
        # so the demo passes with a vanilla SPA; tighten by
        # dropping -I once you have a known baseline.
        # `-c rules.tsv` loads web/.zap-rules.tsv — silences the
        # web-specific false positives (cache policy two-way, SPA
        # informational detection).
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          mkdir -p /tmp/zap && chmod 777 /tmp/zap
          cp web/.zap-rules.tsv /tmp/zap/rules.tsv
          docker run --rm \
            --network host \
            --add-host=myapp.local:127.0.0.1 \
            --add-host=api.myapp.local:127.0.0.1 \
            -v /tmp/zap:/zap/wrk:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://myapp.local \
              -c rules.tsv \
              -I \
              -r web-zap-report.html 2>&1 | tee /tmp/zap.out
          RC=${PIPESTATUS[0]}
          {
            echo "## owasp-web"
            echo
            echo "**zap-baseline** \`http://myapp.local\` — exit $RC"
            echo
            echo '```'
            tail -n 80 /tmp/zap.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-web-report
          path: /tmp/zap/web-zap-report.html
          retention-days: 30
