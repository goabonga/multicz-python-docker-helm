name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          # multicz validate / plan need full history for tag detection.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --frozen

      - name: Run pytest
        run: |
          uv run pytest -q | tee /tmp/pytest.out
          {
            echo "## test (Python ${{ matrix.python }})"
            echo
            echo "**pytest**"
            echo
            echo '```'
            tail -n 5 /tmp/pytest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: |
          uv run ruff check src tests
          echo "**ruff**: \`All checks passed!\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install multicz
        run: uv tool install multicz

      - name: Validate multicz.toml
        run: |
          multicz validate --strict | tee /tmp/validate.out
          {
            echo "**multicz validate**"
            echo
            echo '```'
            cat /tmp/validate.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  helm:
    runs-on: ubuntu-latest
    permissions:
      packages: read   # needed to pull subchart OCI deps from ghcr.io
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4

      - name: Helm lint subcharts
        run: |
          {
            echo "## helm"
            echo
            echo "### Subcharts"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for c in charts/myapp-api charts/myapp-web; do
            helm lint "$c" | tee "/tmp/lint-$(basename $c).out"
            echo "- \`$c\`: $(tail -n 1 /tmp/lint-$(basename $c).out)" \
              >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Helm registry login (ghcr.io)
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io \
            -u '${{ github.actor }}' --password-stdin

      - name: Resolve umbrella OCI deps + lint + smoke render
        # `continue-on-error: true` accommodates the bootstrap window:
        # before the first release publishes the subcharts to ghcr.io,
        # `helm dependency update` can't resolve oci://.../myapp-{api,web}.
        # The release job will publish them in dependency order, after
        # which subsequent CI runs render fully.
        id: umbrella
        continue-on-error: true
        run: |
          helm dependency update charts/myapp
          helm lint charts/myapp
          RESOURCES=$(helm template charts/myapp | grep -cE '^kind:')
          {
            echo
            echo "### Umbrella"
            echo
            echo "- \`charts/myapp\`: lint OK, ${RESOURCES} k8s resources rendered"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Note umbrella bootstrap skip
        if: steps.umbrella.outcome == 'failure'
        run: |
          {
            echo
            echo "### Umbrella"
            echo
            echo "- \`charts/myapp\`: skipped (subcharts not yet on ghcr.io — bootstrap window)"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm test 2>&1 | tee /tmp/vitest.out
          {
            echo "## web"
            echo
            echo "**vitest**"
            echo
            echo '```'
            grep -E 'Test Files|Tests|Duration' /tmp/vitest.out || tail -n 5 /tmp/vitest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          npm run build 2>&1 | tee /tmp/vite.out
          {
            echo
            echo "**vite build**"
            echo
            echo '```'
            grep -E 'dist/|wrote dist/version.json' /tmp/vite.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: .
            tag: api:ci
          - context: web
            tag: web:ci
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.tag }} (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Summary
        run: |
          {
            echo "## docker (${{ matrix.tag }})"
            echo
            echo "- context: \`${{ matrix.context }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- imageid: \`${{ steps.build.outputs.imageid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
