name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  detect:
    # `multicz changed` figures out which components had files modified
    # in the diff window (PR base..HEAD or push before..after) so we
    # only run the matching stack jobs.
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.list }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install multicz
        run: uv tool install multicz

      - name: List changed components
        id: changed
        run: |
          # TEMPORARY OVERRIDE: hardcode every component as changed so
          # every downstream job runs (debugging the full pipeline).
          # Restore the real `multicz changed` block below to revert.
          LIST='["api","web","chart-api","chart-web","chart"]'
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          {
            echo "## detect"
            echo
            echo "**TEMPORARY OVERRIDE** — every component flagged as changed."
            echo
            echo "Changed components: \`$LIST\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # ---- real implementation (restore by removing the override above) ----
          # if [ "${{ github.event_name }}" = "pull_request" ]; then
          #   REF="origin/${{ github.base_ref }}"
          # elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          #   REF="${{ github.event.before }}"
          # else
          #   REF=""
          # fi
          # if [ -n "$REF" ]; then
          #   multicz changed --since "$REF" --output json | tee /tmp/changed.json
          # else
          #   multicz changed --output json | tee /tmp/changed.json
          # fi
          # LIST=$(jq -c '.changed' /tmp/changed.json)
          # echo "list=$LIST" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------- python stack

  python-lint:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.changed), 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: |
          uv run ruff check src tests
          {
            echo "## python-lint"
            echo
            echo "**ruff check**: \`clean\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install multicz
        run: uv tool install multicz

      - name: Validate multicz.toml
        run: |
          multicz validate --strict | tee /tmp/validate.out
          {
            echo
            echo "**multicz validate**"
            echo
            echo '```'
            cat /tmp/validate.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  python-format:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.changed), 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Ruff format check
        run: |
          uv run ruff format --check src tests | tee /tmp/format.out
          {
            echo "## python-format"
            echo
            echo "**ruff format --check**"
            echo
            echo '```'
            cat /tmp/format.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  python-typecheck:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.changed), 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Mypy (strict)
        run: |
          uv run mypy | tee /tmp/mypy.out
          {
            echo "## python-typecheck"
            echo
            echo "**mypy --strict**"
            echo
            echo '```'
            cat /tmp/mypy.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  python-test:
    needs: [detect, python-lint, python-format, python-typecheck]
    if: contains(fromJson(needs.detect.outputs.changed), 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Pytest
        run: |
          uv run pytest -v --color=no --tb=short \
            --junit-xml=/tmp/junit.xml | tee /tmp/pytest.out

      - name: Pytest summary
        if: always()
        run: |
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import sys
          import xml.etree.ElementTree as ET

          if not os.path.exists("/tmp/junit.xml"):
              print("## python-test\n\n**pytest**: no junit output (collection aborted)")
              sys.exit(0)

          tree = ET.parse("/tmp/junit.xml")
          suites = tree.findall(".//testsuite")
          suite = suites[0] if suites else tree.getroot()

          total   = int(suite.get("tests", 0))
          failed  = int(suite.get("failures", 0))
          errors  = int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          passed  = total - failed - errors - skipped
          time    = float(suite.get("time", 0))

          print("## python-test")
          print()
          print(
              f"**pytest** — {passed} ✓  {failed} ✗  "
              f"{errors} ⚠  {skipped} ⏭  ({time:.2f}s)"
          )
          print()
          print("| test | status | time |")
          print("|---|---|---|")

          icons = {"failure": "✗", "error": "⚠", "skipped": "⏭"}
          failures = []
          for tc in suite.iter("testcase"):
              name = f"{tc.get('classname')}::{tc.get('name')}"
              t = float(tc.get("time", 0))
              children = list(tc)
              if not children:
                  status = "✓"
              else:
                  child = children[0]
                  status = icons.get(child.tag, "?")
                  if child.tag in ("failure", "error"):
                      failures.append(
                          (name, child.get("message", ""), child.text or "")
                      )
              print(f"| `{name}` | {status} | {t:.3f}s |")

          if failures:
              print()
              print("### Failures")
              for name, msg, txt in failures:
                  print()
                  print(f"<details><summary><code>{name}</code> — {msg}</summary>")
                  print()
                  print("```")
                  print((txt or "").strip()[:2000])
                  print("```")
                  print("</details>")
          PY

  python-audit:
    needs: [detect, python-test]
    if: contains(fromJson(needs.detect.outputs.changed), 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Audit resolved dependencies
        # `uv export` materialises the locked, non-dev resolution as a
        # fully-hashed requirements.txt; `--no-emit-project` skips
        # the editable `-e .` line which lacks a hash. `--disable-pip`
        # stops pip-audit from re-running its own pip resolution since
        # uv.lock is already authoritative. Default exit code is
        # non-zero on vulnerabilities, propagated via pipefail.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          uv export --no-dev --no-emit-project \
            --format requirements-txt -o /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt --disable-pip | tee /tmp/audit.out
          RC=${PIPESTATUS[0]}
          {
            echo "## python-audit"
            echo
            echo "**pip-audit** \`requirements (no-dev, hashed)\` — exit $RC"
            echo
            echo '```'
            cat /tmp/audit.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  python-bandit:
    needs: [detect, python-test]
    if: contains(fromJson(needs.detect.outputs.changed), 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: uv tool install bandit

      - name: Bandit (AST-based source scan)
        # Recursive scan of src/ only — tests/ are intentionally
        # excluded (assert/subprocess patterns there are noise). Exit
        # 1 on findings is propagated via pipefail.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          bandit -r src -f txt | tee /tmp/bandit.out
          RC=${PIPESTATUS[0]}
          {
            echo "## python-bandit"
            echo
            echo "**bandit** \`-r src\` — exit $RC"
            echo
            echo '```'
            cat /tmp/bandit.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  python-container:
    needs: [python-audit, python-bandit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build api docker image (load locally, no push)
        id: build_api
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true   # populates outputs.imageid + outputs.digest
          tags: api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Save image as tarball for downstream scans
        run: docker save api:ci -o /tmp/api.tar

      - uses: actions/upload-artifact@v7
        with:
          name: api-image
          path: /tmp/api.tar
          retention-days: 1

      - name: Summarise api image
        run: |
          {
            echo "## python-container"
            echo
            echo "**api image** (built, not pushed)"
            echo
            echo "- digest: \`${{ steps.build_api.outputs.digest }}\`"
            echo "- imageid: \`${{ steps.build_api.outputs.imageid }}\`"
            echo "- tarball: \`/tmp/api.tar\` (uploaded as \`api-image\` artifact)"
          } >> "$GITHUB_STEP_SUMMARY"

  python-sbom:
    needs: python-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: api-image
          path: /tmp

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft docker-archive:/tmp/api.tar \
            -o spdx-json=/tmp/api.sbom.spdx.json \
            -o table > /tmp/sbom.txt
          {
            echo "## python-sbom"
            echo
            echo "**syft** \`docker-archive:/tmp/api.tar\` → \`spdx-json\`"
            echo
            echo '```'
            head -n 50 /tmp/sbom.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: api-sbom
          path: /tmp/api.sbom.spdx.json
          retention-days: 30

  python-grype:
    needs: python-sbom
    runs-on: ubuntu-latest
    steps:
      # Checkout for the repo-level `grype.yaml` ignore list — see
      # that file for the rationale of each whitelisted CVE.
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: api-sbom
          path: /tmp

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan SBOM (--fail-on high)
        # `--fail-on high` means findings of severity high or critical
        # exit non-zero. Medium/low/negligible are reported but don't
        # block. Tighten to `medium` if you want stricter gating.
        # `--config grype.yaml` honors the repo-level ignore list.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          grype sbom:/tmp/api.sbom.spdx.json --fail-on high \
            --config grype.yaml \
            --output table | tee /tmp/grype.out
          RC=${PIPESTATUS[0]}
          {
            echo "## python-grype"
            echo
            echo "**grype** \`sbom:api.sbom.spdx.json --fail-on high\` — exit $RC"
            echo
            echo '```'
            cat /tmp/grype.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  # -------------------------------------------------------------- js stack

  js-lint:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.changed), 'web')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Biome lint
        env:
          NO_COLOR: "1"
        run: |
          npx biome lint . | tee /tmp/lint.out
          {
            echo "## js-lint"
            echo
            echo "**biome lint**"
            echo
            echo '```'
            cat /tmp/lint.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  js-format:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.changed), 'web')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Biome format check
        env:
          NO_COLOR: "1"
        run: |
          npx biome format . | tee /tmp/format.out
          {
            echo "## js-format"
            echo
            echo "**biome format** (check-only)"
            echo
            echo '```'
            cat /tmp/format.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  js-typecheck:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.changed), 'web')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: TypeScript typecheck
        run: |
          npx tsc --noEmit
          {
            echo "## js-typecheck"
            echo
            echo "**tsc --noEmit**: \`clean\`"
          } >> "$GITHUB_STEP_SUMMARY"

  js-test:
    needs: [detect, js-lint, js-format, js-typecheck]
    if: contains(fromJson(needs.detect.outputs.changed), 'web')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Vitest
        run: |
          npm test -- --no-color 2>&1 | tee /tmp/vitest.out
          {
            echo "## js-test"
            echo
            echo "**vitest**"
            echo
            echo '```'
            grep -E 'Test Files|Tests|Duration' /tmp/vitest.out || tail -n 5 /tmp/vitest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  js-audit:
    needs: [detect, js-test]
    if: contains(fromJson(needs.detect.outputs.changed), 'web')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: npm audit
        # Default --audit-level is `low`, which is too noisy for CI.
        # Hard-fail only on high+critical via --audit-level=high.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          npm audit --audit-level=high | tee /tmp/audit.out
          RC=${PIPESTATUS[0]}
          {
            echo "## js-audit"
            echo
            echo "**npm audit** \`--audit-level=high\` — exit $RC"
            echo
            echo '```'
            cat /tmp/audit.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  js-eslint-security:
    needs: [detect, js-test]
    if: contains(fromJson(needs.detect.outputs.changed), 'web')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint with security plugins
        # `eslint-plugin-security` (MIT) catches detect-eval,
        # detect-non-literal-fs-filename, detect-object-injection, …
        # `eslint-plugin-no-unsanitized` (MPL-2.0) flags innerHTML /
        # document.write / insertAdjacentHTML with non-literal input.
        # See web/eslint.config.js for the rule set; biome handles
        # general lint + format separately.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          npx eslint src 2>&1 | tee /tmp/eslint-security.out
          RC=${PIPESTATUS[0]}
          {
            echo "## js-eslint-security"
            echo
            echo "**eslint** \`src\` (security + no-unsanitized plugins) — exit $RC"
            echo
            echo '```'
            cat /tmp/eslint-security.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  js-njsscan:
    needs: [detect, js-test]
    if: contains(fromJson(needs.detect.outputs.changed), 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install njsscan
        run: uv tool install njsscan

      - name: njsscan
        # njsscan (LGPL-3.0) is a Node.js / JavaScript-focused SAST
        # scanner from MobSF — pattern + semantic grep over the
        # source. Default exit is non-zero on findings.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          njsscan web/src 2>&1 | tee /tmp/njsscan.out
          RC=${PIPESTATUS[0]}
          {
            echo "## js-njsscan"
            echo
            echo "**njsscan** \`web/src\` — exit $RC"
            echo
            echo '```'
            cat /tmp/njsscan.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  js-semgrep:
    needs: [detect, js-test]
    if: contains(fromJson(needs.detect.outputs.changed), 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install semgrep (OSS engine)
        run: uv tool install semgrep

      - name: Semgrep — p/javascript + p/typescript
        # Semgrep Community Edition (LGPL-2.1) with the open
        # rulesets. `--error` makes findings hard-fail; `--quiet`
        # silences the per-file progress so the summary stays
        # readable.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          semgrep \
            --config p/javascript \
            --config p/typescript \
            --error --quiet \
            web/src 2>&1 | tee /tmp/semgrep.out
          RC=${PIPESTATUS[0]}
          {
            echo "## js-semgrep"
            echo
            echo "**semgrep** \`p/javascript + p/typescript\` on \`web/src\` — exit $RC"
            echo
            echo '```'
            cat /tmp/semgrep.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  js-container:
    needs: [js-audit, js-eslint-security, js-njsscan, js-semgrep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build web docker image (load locally, no push)
        id: build_web
        uses: docker/build-push-action@v7
        with:
          context: web
          load: true   # populates outputs.imageid + outputs.digest
          tags: web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Save image as tarball for downstream scans
        run: docker save web:ci -o /tmp/web.tar

      - uses: actions/upload-artifact@v7
        with:
          name: web-image
          path: /tmp/web.tar
          retention-days: 1

      - name: Summarise web image
        run: |
          {
            echo "## js-container"
            echo
            echo "**web image** (built, not pushed)"
            echo
            echo "- digest: \`${{ steps.build_web.outputs.digest }}\`"
            echo "- imageid: \`${{ steps.build_web.outputs.imageid }}\`"
            echo "- tarball: \`/tmp/web.tar\` (uploaded as \`web-image\` artifact)"
          } >> "$GITHUB_STEP_SUMMARY"

  js-sbom:
    needs: js-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web-image
          path: /tmp

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft docker-archive:/tmp/web.tar \
            -o spdx-json=/tmp/web.sbom.spdx.json \
            -o table > /tmp/sbom.txt
          {
            echo "## js-sbom"
            echo
            echo "**syft** \`docker-archive:/tmp/web.tar\` → \`spdx-json\`"
            echo
            echo '```'
            head -n 50 /tmp/sbom.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: web-sbom
          path: /tmp/web.sbom.spdx.json
          retention-days: 30

  js-grype:
    needs: js-sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: web-sbom
          path: /tmp

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan SBOM (--fail-on high)
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          grype sbom:/tmp/web.sbom.spdx.json --fail-on high \
            --config grype.yaml \
            --output table | tee /tmp/grype.out
          RC=${PIPESTATUS[0]}
          {
            echo "## js-grype"
            echo
            echo "**grype** \`sbom:web.sbom.spdx.json --fail-on high\` — exit $RC"
            echo
            echo '```'
            cat /tmp/grype.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  # ----------------------------------------------------------- helm charts

  chart-api-check:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.changed), 'chart-api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Helm lint
        run: |
          helm lint charts/myapp-api | tee /tmp/lint-api.out
          {
            echo "## chart-api-check"
            echo
            echo "**helm lint** \`charts/myapp-api\`"
            echo
            echo '```'
            cat /tmp/lint-api.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart-web-check:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.changed), 'chart-web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Helm lint
        run: |
          helm lint charts/myapp-web | tee /tmp/lint-web.out
          {
            echo "## chart-web-check"
            echo
            echo "**helm lint** \`charts/myapp-web\`"
            echo
            echo '```'
            cat /tmp/lint-web.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart-check:
    needs: detect
    if: contains(fromJson(needs.detect.outputs.changed), 'chart')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Bundle subcharts (umbrella's deps)
        # `helm lint` on the umbrella complains about unresolved
        # dependencies if charts/myapp/charts/ is empty — package the
        # local subcharts at their HEAD version so the lint sees them.
        run: |
          mkdir -p charts/myapp/charts
          helm package charts/myapp-api -d charts/myapp/charts
          helm package charts/myapp-web -d charts/myapp/charts
      - name: Helm lint umbrella + smoke render
        run: |
          helm lint charts/myapp | tee /tmp/lint-umbrella.out
          RESOURCES=$(helm template charts/myapp | grep -cE '^kind:')
          {
            echo "## chart-check"
            echo
            echo "**helm lint** \`charts/myapp\` (umbrella)"
            echo
            echo '```'
            cat /tmp/lint-umbrella.out
            echo '```'
            echo
            echo "**helm template**: ${RESOURCES} k8s resources rendered"
          } >> "$GITHUB_STEP_SUMMARY"

  helm-securities:
    # Runs after all chart-*-check jobs whenever any helm component
    # changed. `!cancelled() && !failure()` lets us proceed even if
    # some chart-*-check were skipped (their component didn't change),
    # while still bailing out when an upstream actually failed.
    needs: [detect, chart-api-check, chart-web-check, chart-check]
    if: |
      !cancelled() && !failure() &&
      (contains(fromJson(needs.detect.outputs.changed), 'chart-api') ||
       contains(fromJson(needs.detect.outputs.changed), 'chart-web') ||
       contains(fromJson(needs.detect.outputs.changed), 'chart'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Bundle umbrella subcharts + render hardened manifests
        # We pre-render with the same flags the production install
        # uses (--namespace + networkPolicy.enabled=true) so checkov
        # sees the chart in its hardened deployed shape, not its
        # default-namespace dev shape. Scanning the rendered yaml in
        # `--framework kubernetes` mode lets us pass our own helm
        # flags rather than letting checkov re-render with defaults.
        run: |
          mkdir -p charts/myapp/charts /tmp/rendered
          helm package charts/myapp-api -d charts/myapp/charts
          helm package charts/myapp-web -d charts/myapp/charts
          helm template release charts/myapp \
            --namespace myapp \
            --set "myapp-api.networkPolicy.enabled=true" \
            --set "myapp-web.networkPolicy.enabled=true" \
            > /tmp/rendered/myapp.yaml

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install checkov
        run: uv tool install checkov

      - name: Run checkov on the hardened render
        # CKV_K8S_43 (image digest pinning) is intentionally skipped:
        # it conflicts with multicz's tag-based mirror pattern — the
        # digest only exists after the docker build, which happens
        # *after* the bump, so it can't be written into Chart.yaml at
        # bump time. Address by signing + verifying via cosign instead
        # if you need image-immutability guarantees.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          set +e
          checkov --framework kubernetes --file /tmp/rendered/myapp.yaml \
            --skip-check CKV_K8S_43 \
            --quiet --compact --output cli | tee /tmp/checkov.out
          RC=${PIPESTATUS[0]}
          {
            echo "## helm-securities"
            echo
            echo "**checkov** \`--framework kubernetes\` on rendered umbrella — exit $RC"
            echo
            echo "Skipped: \`CKV_K8S_43\` (digest pinning conflicts with multicz tag mirrors)"
            echo
            echo '```'
            cat /tmp/checkov.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
