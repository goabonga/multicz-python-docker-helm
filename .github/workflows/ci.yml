name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # multicz validate / plan need full history for tag detection.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      # ----- check -----

      - name: Ruff
        run: |
          uv run ruff check src tests
          echo "**ruff**: \`All checks passed!\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install multicz
        run: uv tool install multicz

      - name: Validate multicz.toml
        run: |
          multicz validate --strict | tee /tmp/validate.out
          {
            echo "**multicz validate**"
            echo
            echo '```'
            cat /tmp/validate.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ----- test -----

      - name: Pytest
        run: |
          uv run pytest -q | tee /tmp/pytest.out
          {
            echo "## python"
            echo
            echo "**pytest**"
            echo
            echo '```'
            tail -n 5 /tmp/pytest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ----- build image -----

      - uses: docker/setup-buildx-action@v3

      - name: Build api docker image (no push)
        id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Summarise api image
        run: |
          {
            echo
            echo "**api image** (built, not pushed)"
            echo
            echo "- digest: \`${{ steps.build_api.outputs.digest }}\`"
            echo "- imageid: \`${{ steps.build_api.outputs.imageid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # ----- check -----

      - name: TypeScript typecheck
        run: |
          npx tsc --noEmit
          echo "**tsc**: \`type-check passed\`" >> "$GITHUB_STEP_SUMMARY"

      # ----- test -----

      - name: Vitest
        run: |
          npm test -- --no-color 2>&1 | tee /tmp/vitest.out
          {
            echo "## js"
            echo
            echo "**vitest**"
            echo
            echo '```'
            grep -E 'Test Files|Tests|Duration' /tmp/vitest.out || tail -n 5 /tmp/vitest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ----- build (vite bundle, then docker image) -----

      - name: Vite build
        env:
          NO_COLOR: "1"
        run: |
          npm run build 2>&1 | tee /tmp/vite.out
          {
            echo
            echo "**vite build**"
            echo
            echo '```'
            grep -E 'dist/|wrote dist/version.json' /tmp/vite.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Build web docker image (no push)
        id: build_web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summarise web image
        run: |
          {
            echo
            echo "**web image** (built, not pushed)"
            echo
            echo "- digest: \`${{ steps.build_web.outputs.digest }}\`"
            echo "- imageid: \`${{ steps.build_web.outputs.imageid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
