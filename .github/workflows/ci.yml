name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          # multicz validate / plan need full history for tag detection.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check src tests

      - name: Install multicz
        run: uv tool install multicz

      - name: Validate multicz.toml
        run: multicz validate --strict

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint charts/myapp

      - name: Helm template (smoke render)
        run: helm template charts/myapp >/dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: .
            tag: api:ci
          - context: web
            tag: web:ci
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.tag }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
