name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          # multicz validate / plan need full history for tag detection.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check src tests

      - name: Install multicz
        # Once multicz lands on PyPI: `uv tool install multicz`.
        run: uv tool install git+https://github.com/goabonga/multicz

      - name: Validate multicz.toml
        run: multicz validate --strict

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint charts/myapp

      - name: Helm template (smoke render)
        run: helm template charts/myapp >/dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: myapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
