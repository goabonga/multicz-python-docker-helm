name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          # multicz validate / plan need full history for tag detection.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check src tests

      - name: Install multicz
        run: uv tool install multicz

      - name: Validate multicz.toml
        run: multicz validate --strict

  helm:
    runs-on: ubuntu-latest
    permissions:
      packages: read   # needed to pull subchart OCI deps from ghcr.io
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4

      - name: Helm lint subcharts
        run: |
          helm lint charts/myapp-api
          helm lint charts/myapp-web

      - name: Helm registry login (ghcr.io)
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io \
            -u '${{ github.actor }}' --password-stdin

      - name: Resolve umbrella OCI deps + lint + smoke render
        # `continue-on-error: true` accommodates the bootstrap window:
        # before the first release publishes the subcharts to ghcr.io,
        # `helm dependency update` can't resolve oci://.../myapp-{api,web}.
        # The release job will publish them in dependency order, after
        # which subsequent CI runs render fully.
        continue-on-error: true
        run: |
          helm dependency update charts/myapp
          helm lint charts/myapp
          helm template charts/myapp >/dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: .
            tag: api:ci
          - context: web
            tag: web:ci
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.tag }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
