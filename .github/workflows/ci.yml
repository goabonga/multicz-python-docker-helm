name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # multicz validate / plan need full history for tag detection.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      # ----- check -----

      - name: Ruff
        run: |
          uv run ruff check src tests
          echo "**ruff**: \`All checks passed!\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install multicz
        run: uv tool install multicz

      - name: Validate multicz.toml
        run: |
          multicz validate --strict | tee /tmp/validate.out
          {
            echo "**multicz validate**"
            echo
            echo '```'
            cat /tmp/validate.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ----- test -----

      - name: Pytest
        run: |
          uv run pytest -v --color=no --tb=short \
            --junit-xml=/tmp/junit.xml | tee /tmp/pytest.out

      - name: Pytest summary
        if: always()
        run: |
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import sys
          import xml.etree.ElementTree as ET

          if not os.path.exists("/tmp/junit.xml"):
              print("## python\n\n**pytest**: no junit output (collection aborted)")
              sys.exit(0)

          tree = ET.parse("/tmp/junit.xml")
          suites = tree.findall(".//testsuite")
          suite = suites[0] if suites else tree.getroot()

          total   = int(suite.get("tests", 0))
          failed  = int(suite.get("failures", 0))
          errors  = int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          passed  = total - failed - errors - skipped
          time    = float(suite.get("time", 0))

          print("## python")
          print()
          print(
              f"**pytest** — {passed} ✓  {failed} ✗  "
              f"{errors} ⚠  {skipped} ⏭  ({time:.2f}s)"
          )
          print()
          print("| test | status | time |")
          print("|---|---|---|")

          icons = {"failure": "✗", "error": "⚠", "skipped": "⏭"}
          failures = []
          for tc in suite.iter("testcase"):
              name = f"{tc.get('classname')}::{tc.get('name')}"
              t = float(tc.get("time", 0))
              children = list(tc)
              if not children:
                  status = "✓"
              else:
                  child = children[0]
                  status = icons.get(child.tag, "?")
                  if child.tag in ("failure", "error"):
                      failures.append(
                          (name, child.get("message", ""), child.text or "")
                      )
              print(f"| `{name}` | {status} | {t:.3f}s |")

          if failures:
              print()
              print("### Failures")
              for name, msg, txt in failures:
                  print()
                  print(f"<details><summary><code>{name}</code> — {msg}</summary>")
                  print()
                  print("```")
                  print((txt or "").strip()[:2000])
                  print("```")
                  print("</details>")
          PY

      # ----- build image -----

      - uses: docker/setup-buildx-action@v3

      - name: Build api docker image (no push)
        id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Summarise api image
        run: |
          {
            echo
            echo "**api image** (built, not pushed)"
            echo
            echo "- digest: \`${{ steps.build_api.outputs.digest }}\`"
            echo "- imageid: \`${{ steps.build_api.outputs.imageid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # ----- check -----

      - name: TypeScript typecheck
        run: |
          npx tsc --noEmit
          echo "**tsc**: \`type-check passed\`" >> "$GITHUB_STEP_SUMMARY"

      # ----- test -----

      - name: Vitest
        run: |
          npm test -- --no-color 2>&1 | tee /tmp/vitest.out
          {
            echo "## js"
            echo
            echo "**vitest**"
            echo
            echo '```'
            grep -E 'Test Files|Tests|Duration' /tmp/vitest.out || tail -n 5 /tmp/vitest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ----- build (vite bundle, then docker image) -----

      - name: Vite build
        env:
          NO_COLOR: "1"
        run: |
          npm run build 2>&1 | tee /tmp/vite.out
          {
            echo
            echo "**vite build**"
            echo
            echo '```'
            grep -E 'dist/|wrote dist/version.json' /tmp/vite.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Build web docker image (no push)
        id: build_web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summarise web image
        run: |
          {
            echo
            echo "**web image** (built, not pushed)"
            echo
            echo "- digest: \`${{ steps.build_web.outputs.digest }}\`"
            echo "- imageid: \`${{ steps.build_web.outputs.imageid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
