name: release

# Demo release pipeline driven by multicz.
#
# Runs after the `ci` workflow finishes green on main:
#   1. plan the release (skip the rest if nothing pending)
#   2. bump pyproject.toml + Chart.yaml + uv.lock + CHANGELOGs, commit
#      and tag LOCALLY (no push yet)
#   3. build api + web docker images at the future tags
#   4. spin up a kind cluster, helm install the umbrella with the
#      locally-loaded images, and verify api `/version` + web
#      `/version.json` return the future versions
#   5. only after smoke tests pass: `git push --follow-tags` and push
#      images + helm subcharts + umbrella to ghcr.io
#   6. open one GitHub Release per new tag, with notes from
#      `multicz release-notes`
#
# If smoke tests fail in step 4, the local commit + tags die with the
# ephemeral runner and the remote sees no release.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write   # push the release commit and tags
  packages: write   # push docker image + helm chart to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          NAME="${{ github.event.workflow_run.head_commit.author.name }}"
          EMAIL="${{ github.event.workflow_run.head_commit.author.email }}"
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Install multicz
        run: uv tool install multicz

      - name: Plan
        id: plan
        run: |
          multicz plan --summary "$GITHUB_STEP_SUMMARY" \
            --output json | tee /tmp/plan.json
          if [ "$(jq '.bumps | length' /tmp/plan.json)" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag (local; push deferred until smoke tests pass)
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          multicz bump --commit --tag \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.json
          API=$(jq -r       '.bumps.api.next_version          // empty' /tmp/release.json)
          WEB=$(jq -r       '.bumps.web.next_version          // empty' /tmp/release.json)
          CHART_API=$(jq -r '.bumps["chart-api"].next_version // empty' /tmp/release.json)
          CHART_WEB=$(jq -r '.bumps["chart-web"].next_version // empty' /tmp/release.json)
          CHART=$(jq -r     '.bumps.chart.next_version        // empty' /tmp/release.json)
          echo "api_version=$API"             >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB"             >> "$GITHUB_OUTPUT"
          echo "chart_api_version=$CHART_API" >> "$GITHUB_OUTPUT"
          echo "chart_web_version=$CHART_WEB" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART"         >> "$GITHUB_OUTPUT"

      # ghcr.io owners must be lowercase; GitHub usernames usually are
      # already, but normalise anyway so forks under mixed-case org
      # names don't break.
      - name: Compute lowercase owner
        if: steps.plan.outputs.release == 'true'
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        if: >-
          steps.bump.outputs.api_version   != '' ||
          steps.bump.outputs.chart_version != '' ||
          steps.bump.outputs.web_version   != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: steps.bump.outputs.api_version != '' || steps.bump.outputs.web_version != ''

      # ----- Phase 1: build images locally with the future tags -----
      # `load: true` puts them in the local docker daemon (smoke test)
      # without pushing yet. The matching `docker push` happens after
      # smoke tests pass.

      - name: Build api image (load locally)
        if: steps.bump.outputs.api_version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/myapp:${{ steps.bump.outputs.api_version }}
            ghcr.io/${{ steps.owner.outputs.value }}/myapp:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image (load locally)
        if: steps.bump.outputs.web_version != ''
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/web:${{ steps.bump.outputs.web_version }}
            ghcr.io/${{ steps.owner.outputs.value }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ----- Phase 2: kind smoke test (deploy the chart, hit endpoints) -----
      # Validates not just that the images embed the right versions but
      # that the umbrella chart actually deploys cleanly with them.

      - uses: azure/setup-helm@v4
        if: steps.plan.outputs.release == 'true'

      - name: Set up kind cluster
        if: steps.plan.outputs.release == 'true'
        uses: helm/kind-action@v1
        with:
          cluster_name: smoke

      - name: Load smoke images into kind
        if: steps.bump.outputs.api_version != '' || steps.bump.outputs.web_version != ''
        run: |
          if [ -n "${{ steps.bump.outputs.api_version }}" ]; then
            kind load docker-image \
              "ghcr.io/${{ steps.owner.outputs.value }}/myapp:${{ steps.bump.outputs.api_version }}" \
              --name smoke
          fi
          if [ -n "${{ steps.bump.outputs.web_version }}" ]; then
            kind load docker-image \
              "ghcr.io/${{ steps.owner.outputs.value }}/web:${{ steps.bump.outputs.web_version }}" \
              --name smoke
          fi

      - name: Bundle subcharts into umbrella for the smoke install
        if: steps.bump.outputs.chart_version != ''
        run: |
          # Side-step the OCI bootstrap chicken-and-egg: package each
          # subchart into the umbrella's charts/ directory so helm
          # install resolves them locally instead of fetching from ghcr
          # (where they aren't pushed yet).
          mkdir -p charts/myapp/charts
          helm package charts/myapp-api -d charts/myapp/charts
          helm package charts/myapp-web -d charts/myapp/charts

      - name: Helm install umbrella in kind
        if: steps.bump.outputs.chart_version != ''
        run: |
          # `--wait` blocks until every resource (deployments, pods,
          # services) reaches ready state. `kubectl wait` directly on
          # pods races the controller — pods aren't created the
          # moment helm install returns.
          helm install demo charts/myapp \
            --wait --timeout 120s \
            --set "myapp-api.image.repository=ghcr.io/${{ steps.owner.outputs.value }}/myapp" \
            --set "myapp-api.image.pullPolicy=IfNotPresent" \
            --set "myapp-web.image.repository=ghcr.io/${{ steps.owner.outputs.value }}/web" \
            --set "myapp-web.image.pullPolicy=IfNotPresent"

      - name: Smoke test endpoints via port-forward
        if: steps.bump.outputs.chart_version != ''
        env:
          API_EXPECTED: ${{ steps.bump.outputs.api_version }}
          WEB_EXPECTED: ${{ steps.bump.outputs.web_version }}
        run: |
          set -e
          kubectl port-forward svc/demo-myapp-api 8000:8000 >/dev/null 2>&1 &
          PF_API=$!
          kubectl port-forward svc/demo-myapp-web 8080:80 >/dev/null 2>&1 &
          PF_WEB=$!
          trap 'kill $PF_API $PF_WEB 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && \
            curl -fsS http://localhost:8080/version.json >/dev/null 2>&1 && break
            sleep 1
          done

          if [ -n "$API_EXPECTED" ]; then
            GOT=$(curl -fsS http://localhost:8000/version | jq -r .version)
            if [ "$GOT" != "$API_EXPECTED" ]; then
              echo "::error::api /version returned '$GOT', expected '$API_EXPECTED'"
              kubectl logs -l app.kubernetes.io/component=api --tail=50 || true
              exit 1
            fi
            echo "✓ api /version = $GOT"
          fi

          if [ -n "$WEB_EXPECTED" ]; then
            GOT=$(curl -fsS http://localhost:8080/version.json | jq -r .version)
            if [ "$GOT" != "$WEB_EXPECTED" ]; then
              echo "::error::web /version.json returned '$GOT', expected '$WEB_EXPECTED'"
              kubectl logs -l app.kubernetes.io/component=web --tail=50 || true
              exit 1
            fi
            echo "✓ web /version.json = $GOT"
          fi

      - name: Helm uninstall + clean local subchart bundle
        if: always() && steps.bump.outputs.chart_version != ''
        run: |
          helm uninstall demo 2>/dev/null || true
          rm -rf charts/myapp/charts

      # ----- Phase 3: smoke OK — publish (commit, tags, images, charts) -----

      - name: Push commit + tags
        if: steps.plan.outputs.release == 'true'
        run: git push --follow-tags

      - name: Push api image to ghcr
        if: steps.bump.outputs.api_version != ''
        run: |
          docker push ghcr.io/${{ steps.owner.outputs.value }}/myapp:${{ steps.bump.outputs.api_version }}
          docker push ghcr.io/${{ steps.owner.outputs.value }}/myapp:latest

      - name: Push web image to ghcr
        if: steps.bump.outputs.web_version != ''
        run: |
          docker push ghcr.io/${{ steps.owner.outputs.value }}/web:${{ steps.bump.outputs.web_version }}
          docker push ghcr.io/${{ steps.owner.outputs.value }}/web:latest

      - name: Helm registry login
        if: >-
          steps.bump.outputs.chart_api_version != '' ||
          steps.bump.outputs.chart_web_version != '' ||
          steps.bump.outputs.chart_version     != ''
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io \
            -u '${{ github.actor }}' --password-stdin

      # Subcharts are pushed not only when they bump (chart_api / chart_web
      # condition) but ALSO when the umbrella bumps without them — because
      # `helm dependency update` on the umbrella resolves the version
      # currently in Chart.yaml's dependencies block, which must already
      # exist on ghcr. Re-pushing an unchanged version is an OCI no-op.
      - name: Package and push myapp-api subchart
        if: >-
          steps.bump.outputs.chart_api_version != '' ||
          steps.bump.outputs.chart_version     != ''
        run: |
          helm package charts/myapp-api --destination /tmp
          VER=$(awk '/^version:/{print $2; exit}' charts/myapp-api/Chart.yaml)
          helm push "/tmp/myapp-api-${VER}.tgz" \
            "oci://ghcr.io/${{ steps.owner.outputs.value }}/charts"

      - name: Package and push myapp-web subchart
        if: >-
          steps.bump.outputs.chart_web_version != '' ||
          steps.bump.outputs.chart_version     != ''
        run: |
          helm package charts/myapp-web --destination /tmp
          VER=$(awk '/^version:/{print $2; exit}' charts/myapp-web/Chart.yaml)
          helm push "/tmp/myapp-web-${VER}.tgz" \
            "oci://ghcr.io/${{ steps.owner.outputs.value }}/charts"

      - name: Package and push umbrella myapp chart
        if: steps.bump.outputs.chart_version != ''
        run: |
          # Resolve the OCI subchart deps from ghcr (the two `helm push`
          # steps above just put them there). `helm dependency update`
          # populates charts/myapp/charts/myapp-{api,web}-X.Y.Z.tgz so
          # `helm install myapp` ships the bundled subcharts.
          helm dependency update charts/myapp
          helm package charts/myapp --destination /tmp
          helm push /tmp/myapp-${{ steps.bump.outputs.chart_version }}.tgz \
            oci://ghcr.io/${{ steps.owner.outputs.value }}/charts

      - name: Create GitHub Releases
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            multicz release-notes --tag "$tag" \
              | gh release create "$tag" --title "$tag" --notes-file -
          done
