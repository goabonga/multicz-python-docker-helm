replicaCount: 1

image:
  repository: ghcr.io/example/web
  pullPolicy: Always
  # Defaults to .Chart.AppVersion when empty.
  tag: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: myapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Hardened defaults — chainguard nginx already runs as nonroot UID
# 65532 but checkov wants the spec explicit.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# With readOnlyRootFilesystem: true, nginx still needs writable
# paths for its pid file, caches, logs, and request buffers. The
# chainguard nginx config (cat /etc/nginx/nginx.conf) writes:
#
#   pid        /run/nginx.pid;
#   error_log  /var/log/nginx/error.log;
#   access_log /var/log/nginx/access.log;
#
# plus client_body / proxy / fastcgi temp files under
# /var/lib/nginx/tmp/. fsGroup=65532 (set in podSecurityContext)
# tells kubelet to chown each emptyDir mount, so the nonroot user
# in the image can write.
extraVolumeMounts:
  - name: nginx-cache
    mountPath: /var/cache/nginx
  - name: nginx-log
    mountPath: /var/log/nginx
  - name: nginx-tmp
    mountPath: /var/lib/nginx/tmp
  - name: run
    mountPath: /run
  - name: tmp
    mountPath: /tmp
extraVolumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-log
    emptyDir: {}
  - name: nginx-tmp
    emptyDir: {}
  - name: run
    emptyDir: {}
  - name: tmp
    emptyDir: {}

automountServiceAccountToken: false

# Runtime config injected into the SPA via window.APP_CONFIG. The
# chart renders this into a ConfigMap and mounts it at
# /usr/share/nginx/html/config.js (overlaying the empty placeholder
# baked into the docker image). Setting apiUrl to e.g.
# "http://api.myapp.local" lets the SPA fetch a different host
# without rebuilding the image.
config:
  apiUrl: ""

networkPolicy:
  enabled: false

resources:
  limits:
    cpu: 200m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi
nodeSelector: {}
tolerations: []
affinity: {}
