apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myapp-web.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp-web.labels" . | nindent 4 }}
data:
  # Rendered into /usr/share/nginx/html/config.js at pod startup
  # via a subPath mount. The SPA's index.html loads this BEFORE
  # main.ts, so window.APP_CONFIG is populated when the bundle
  # reads it. Empty values keep the bundled placeholder behaviour
  # (main.ts falls back to "/api").
  config.js: |
    window.APP_CONFIG = {
      API_URL: {{ .Values.config.apiUrl | default "" | quote }},
    };
