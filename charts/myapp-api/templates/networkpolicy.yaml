{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myapp-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "myapp-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Default: allow ingress from any pod in the same namespace.
    # Tighten to specific labels (e.g. the web subchart) for prod.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS — every pod needs it.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
