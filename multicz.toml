[project]
commit_convention = "conventional"
tag_format = "{component}-v{version}"
initial_version = "0.0.0"

# api: the FastAPI application. The image tag mirrors `version`, and
# the chart's `appVersion` mirrors it too — so a feature commit on the
# Python source bumps `api`, retags the docker image, and (via the
# mirror cascade) patch-bumps the chart so its packaged artifact pins
# the new appVersion immutably.
[components.api]
paths      = ["src/**", "pyproject.toml", "tests/**", "Dockerfile"]
bump_files = [
    { file = "pyproject.toml", key = "project.version" },
    # Regex escape hatch: keep `__version__` in the package's __init__
    # in sync with pyproject.toml. The first capture group is rewritten;
    # surrounding code (docstrings, imports, …) is preserved as-is.
    { file = "src/api/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
]
mirrors    = [{ file = "charts/myapp/Chart.yaml", key = "appVersion" }]
changelog  = "CHANGELOG.md"
post_bump  = ["uv lock"]

[[components.api.artifacts]]
type = "docker"
ref  = "ghcr.io/example/myapp:{version}"

# chart: the Helm chart. Bumps directly when chart templates change,
# and patch-bumps automatically when api's appVersion mirror lands
# (mirror cascade — keeps `myapp-X.Y.Z.tgz` immutable).
[components.chart]
paths      = ["charts/myapp/**"]
bump_files = [{ file = "charts/myapp/Chart.yaml", key = "version" }]
changelog  = "charts/myapp/CHANGELOG.md"

[[components.chart.artifacts]]
type = "helm"
ref  = "myapp-{version}.tgz"

# web: vanilla TypeScript frontend (Vite), shipped as an nginx-based
# Docker image. Independent of api/chart — own version, own changelog.
# Both `package.json:version` and `src/version.ts:VERSION` stay in sync,
# the second via the regex escape hatch (TS isn't a structured-config
# format multicz parses).
[components.web]
paths      = ["web/**"]
bump_files = [
    { file = "web/package.json", key = "version" },
    { file = "web/src/version.ts", key = 'regex:export const VERSION\s*=\s*"([^"]+)"' },
]
changelog  = "web/CHANGELOG.md"
post_bump  = ["npm --prefix web install --package-lock-only"]

[[components.web.artifacts]]
type = "docker"
ref  = "ghcr.io/example/web:{version}"
