[project]
commit_convention = "conventional"
tag_format = "{component}-v{version}"
initial_version = "0.0.0"

# api: FastAPI app. Mirrors its version into the api subchart's
# appVersion (so `helm package` pins the image), which then cascades
# patch-bumps onto chart-api.
[components.api]
paths      = ["src/**", "pyproject.toml", "tests/**", "e2e/**", "/Dockerfile"]
bump_files = [
    { file = "pyproject.toml", key = "project.version" },
    # Regex escape hatch: keep `__version__` in the package's __init__
    # in sync with pyproject.toml. The first capture group is rewritten;
    # surrounding code (docstrings, imports, …) is preserved as-is.
    { file = "src/api/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
]
changelog  = "CHANGELOG.md"
post_bump  = ["uv lock"]

[[components.api.mirrors]]
file             = "charts/myapp-api/Chart.yaml"
key              = "appVersion"
changelog_format = "chart-api now ships the api image at `{upstream_version}`"

[[components.api.artifacts]]
type = "docker"
ref  = "ghcr.io/example/myapp:{version}"

# web: vanilla TypeScript frontend (Vite), shipped as nginx Docker
# image. Mirrors its version into the web subchart's appVersion (same
# pattern as api).
[components.web]
paths      = ["web/**"]
bump_files = [
    { file = "web/package.json", key = "version" },
    { file = "web/src/version.ts", key = 'regex:export const VERSION\s*=\s*"([^"]+)"' },
]
changelog  = "web/CHANGELOG.md"
post_bump  = ["npm --prefix web install --package-lock-only"]

[[components.web.mirrors]]
file             = "charts/myapp-web/Chart.yaml"
key              = "appVersion"
changelog_format = "chart-web now ships the web image at `{upstream_version}`"

[[components.web.artifacts]]
type = "docker"
ref  = "ghcr.io/example/web:{version}"

# chart-api: api subchart. Bumps directly when its templates change,
# patch-bumps via cascade when api's appVersion mirror lands. Also
# forwards its version into the parent's `dependencies[name=myapp-api]`
# block — that mirror in turn cascades onto chart.
[components.chart-api]
paths      = ["charts/myapp-api/**"]
bump_files = [{ file = "charts/myapp-api/Chart.yaml", key = "version" }]
changelog  = "charts/myapp-api/CHANGELOG.md"

[[components.chart-api.mirrors]]
file              = "charts/myapp/Chart.yaml"
key               = 'regex:- name: myapp-api\s+version:\s+(\S+)'
changelog_section = "Subchart updates"
changelog_format  = "Bump `myapp-api` dependency to `{upstream_version}`"

[[components.chart-api.artifacts]]
type = "helm"
ref  = "myapp-api-{version}.tgz"

# chart-web: web subchart. Same shape as chart-api.
[components.chart-web]
paths      = ["charts/myapp-web/**"]
bump_files = [{ file = "charts/myapp-web/Chart.yaml", key = "version" }]
changelog  = "charts/myapp-web/CHANGELOG.md"

[[components.chart-web.mirrors]]
file              = "charts/myapp/Chart.yaml"
key               = 'regex:- name: myapp-web\s+version:\s+(\S+)'
changelog_section = "Subchart updates"
changelog_format  = "Bump `myapp-web` dependency to `{upstream_version}`"

[[components.chart-web.artifacts]]
type = "helm"
ref  = "myapp-web-{version}.tgz"

# chart: umbrella `myapp` chart. Bumps directly when its own
# Chart.yaml or values.yaml changes (including the dependency-block
# rewrites done by chart-api/chart-web mirrors), so any subchart bump
# produces a corresponding parent patch and a fresh `myapp-X.Y.Z.tgz`.
# Kept as `[components.chart]` for tag continuity (existing `chart-vX`
# tags now point at the umbrella).
[components.chart]
paths      = ["charts/myapp/**"]
bump_files = [{ file = "charts/myapp/Chart.yaml", key = "version" }]
changelog  = "charts/myapp/CHANGELOG.md"

[[components.chart.artifacts]]
type = "helm"
ref  = "myapp-{version}.tgz"
