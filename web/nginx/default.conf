# nginx site config — overrides the chainguard nginx default at
# /etc/nginx/conf.d/nginx.default.conf. Adds the security headers
# the OWASP ZAP baseline scan asks for and silences the nginx
# banners on default error pages.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    # Hide nginx version from headers + error pages — closes
    # ZAP "In Page Banner Information Leak" for 404/50x responses.
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers (apply to every response, success or error).
    # `always` ensures they're attached to non-2xx responses too.
    #
    # CSP rationale:
    #   default-src 'self'      — only same origin by default
    #   script-src 'self'       — /assets/*.js + /config.js, both
    #                             served from this origin
    #   style-src 'self' 'unsafe-inline'
    #                           — inline <style> block in index.html
    #   connect-src *           — the SPA's runtime apiUrl points
    #                             cross-origin (e.g. api.myapp.local);
    #                             tighten to specific hosts in prod
    #   img-src 'self' data:    — vite may inline small assets
    #   frame-ancestors 'none'  — equivalent to X-Frame-Options DENY
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # The SPA entry point + runtime config must never be cached —
    # cached config.js would defeat the helm-injected apiUrl, and a
    # cached index.html would point at stale /assets/ hashes after
    # a rebuild. Vite-hashed /assets/* are content-addressed and
    # cached aggressively below.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Hashed bundle — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # SPA fallback: vite uses client-side routing, missing paths
    # should serve index.html (the SPA decides if it's really 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Plain-text error pages — no nginx banner, closes ZAP's
    # "In Page Banner Information Leak" finding for 4xx/5xx that
    # otherwise hit chainguard's default error template.
    error_page 404 = @notfound;
    location @notfound {
        default_type text/plain;
        return 404 "404 Not Found\n";
    }

    error_page 500 502 503 504 = @servererror;
    location @servererror {
        default_type text/plain;
        return 500 "500 Internal Server Error\n";
    }
}
