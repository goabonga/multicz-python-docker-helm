# nginx site config — overrides the chainguard nginx default at
# /etc/nginx/conf.d/nginx.default.conf. Adds the security headers
# the OWASP ZAP baseline scan asks for and silences the nginx
# banners on default error pages.
#
# Design: all security headers live at *server scope*, and a
# `map` decides Cache-Control from the URI. That way no `location`
# block has its own `add_header` directive, so nginx's "child
# wipes parent add_headers as soon as it has any" inheritance
# rule never bites — every response carries the full header set.

# Cache-Control varies by URI:
#   /assets/<hash>.js|css|...   immutable (vite content-addressed)
#   anything else               private + always-revalidate
#
# Why `private, max-age=0, must-revalidate` instead of `no-store`?
# Functionally equivalent for our purposes — the browser must
# re-check with a conditional GET on every request — but `no-store`
# triggers ZAP's 10049 "Non-Storable Content" variant, while this
# combination passes (private = no shared cache → not "cacheable",
# max-age=0 + must-revalidate → not stale-servable). Both variants
# of 10049 stay quiet.
map $uri $multicz_cache_control {
    default               "private, max-age=0, must-revalidate";
    "~^/assets/"          "public, max-age=31536000, immutable";
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    # Hide nginx version from headers + error pages — closes
    # ZAP "In Page Banner Information Leak" for 404/50x responses.
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers — applied to every response (success or
    # error) thanks to `always`. Defined once at server scope; all
    # locations inherit because none of them define their own
    # add_header directives.
    #
    # CSP rationale:
    #   default-src 'self'         only same origin by default
    #   script-src 'self'          /assets/*.js + /config.js
    #   style-src 'self'           styles live in src/style.css,
    #                              vite emits them as a hashed
    #                              /assets/*.css — no inline
    #                              <style> in index.html, so no
    #                              'unsafe-inline' needed (closes
    #                              ZAP 10055-2)
    #   connect-src 'self'         standalone-image default — only
    #                              same-origin allowed. The helm
    #                              chart's ConfigMap overlays this
    #                              whole file via subPath and
    #                              widens connect-src with the
    #                              .Values.config.apiUrl origin
    #                              when the SPA must talk to a
    #                              cross-origin api.
    #   img-src 'self' data:       vite may inline small assets
    #   frame-ancestors 'none'     equivalent to X-Frame-Options DENY
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $multicz_cache_control always;

    # SPA fallback: vite uses client-side routing, missing paths
    # serve index.html (the SPA decides if it's really a 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Plain-text error pages — no nginx banner, closes ZAP's
    # "In Page Banner Information Leak" finding for 4xx/5xx that
    # otherwise hit chainguard's default error template.
    error_page 404 = @notfound;
    location @notfound {
        default_type text/plain;
        return 404 "404 Not Found\n";
    }

    error_page 500 502 503 504 = @servererror;
    location @servererror {
        default_type text/plain;
        return 500 "500 Internal Server Error\n";
    }
}
